name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    name: Run Tests & Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rh_user
          POSTGRES_PASSWORD: rh_password
          POSTGRES_DB: rh_insight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rh_user:rh_password@localhost:5432/rh_insight_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OLLAMA_BASE_URL: http://localhost:11434
      LLM_MODEL_STANDARD: qwen3.5:4b
      LLM_MODEL_REASONING: qwen3.5:4b

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (don't fail build)
          flake8 backend/app --count --max-line-length=120 --statistics --exit-zero

      - name: Run security tests
        run: |
          pytest backend/tests/test_security.py -v

      - name: Run auth tests
        run: |
          pytest backend/tests/test_auth.py -v

      - name: Run all tests
        run: |
          pytest backend/tests/ -v --tb=short
        continue-on-error: true  # Don't fail CI if Ollama-dependent tests can't run
