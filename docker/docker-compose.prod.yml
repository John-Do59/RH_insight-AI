version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: rh-traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certificates:/etc/traefik/acme
    env_file:
      - ../.env
    networks:
      - rh-insight-net

  db:
    image: pgvector/pgvector:pg16
    container_name: rh-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rh_password}
      POSTGRES_DB: ${POSTGRES_DB:-rh_insight}
    command: 
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rh-insight-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rh-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - rh-insight-net

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: rh-backend-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rh_user}:${POSTGRES_PASSWORD:-rh_password}@db:5432/${POSTGRES_DB:-rh_insight}
      REDIS_URL: redis://redis:6379/0
      # Ollama URL should point to either VPS host or an external API provider
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rh-insight-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=security-headers@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: rh-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - rh-insight-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=security-headers@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  rh-insight-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  traefik_certificates:
