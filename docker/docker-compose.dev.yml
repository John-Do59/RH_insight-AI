version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rh-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rh_insight
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - rh-insight-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rh-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - rh-insight-net

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: rh-backend-dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rh_user}:${POSTGRES_PASSWORD:-rh_password}@db:5432/${POSTGRES_DB:-rh_insight}
      REDIS_URL: redis://redis:6379/0
      # Assumes Ollama is running on the host
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app/backend
    ports:
      - "8000:8000"
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - rh-insight-net

  frontend:
    image: node:18-alpine
    container_name: rh-frontend-dev
    working_dir: /app
    volumes:
      - ../frontend/vue-app:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - rh-insight-net

networks:
  rh-insight-net:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
