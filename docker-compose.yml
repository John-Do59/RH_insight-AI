version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: rh-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rh_insight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rh-redis
    restart: always
    networks:
      - rh-network

  # Ollama est géré nativement sur le Mac pour profiter du GPU M4 (Metal)
  # Le backend y accède via host.docker.internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rh-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-rh_insight}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - vector_store_data:/app/backend/data/vector_store
      - ./backend:/app/backend
    networks:
      - rh-network
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rh-frontend
    depends_on:
      - backend
    networks:
      - rh-network
    ports:
      - "80:80"

networks:
  rh-network:
    driver: bridge

volumes:
  postgres_data:
  vector_store_data:
